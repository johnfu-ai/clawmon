<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>clawmon pet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    body { user-select: none; }

    #pet {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    #pet:active { cursor: grabbing; }

    #crab {
      width: 92px;
      height: 92px;
      animation: bob 3.2s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-2.5px); }
    }

    /* claws gently wave on their wrists */
    .claw {
      transform-box: view-box;
      animation: pinch 2.4s ease-in-out infinite;
    }
    .claw-l { transform-origin: 34px 64px; }
    .claw-r { transform-origin: 66px 64px; animation-delay: 1.2s; }
    @keyframes pinch {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(6deg); }
    }

    /* happy eyes blink; other eye sets are swapped per state below */
    .eyes { display: none; }
    #pet[data-state="green"]  .eyes.happy,
    #pet[data-state="yellow"] .eyes.asleep,
    #pet[data-state="red"]    .eyes.alarmed,
    #pet[data-state="off"]    .eyes.asleep { display: block; }

    #pet[data-state="green"] .eyes .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.2s infinite;
    }
    @keyframes blink {
      0%, 93%, 100% { transform: scaleY(1); }
      96%           { transform: scaleY(0.08); }
    }

    .mouth { display: none; }
    #pet[data-state="green"]  .mouth.smile,
    #pet[data-state="yellow"] .mouth.smile,
    #pet[data-state="red"]    .mouth.gasp { display: block; }

    .sweat { display: none; }
    #pet[data-state="yellow"] .sweat,
    #pet[data-state="off"]    .sweat { display: block; }

    .alert { display: none; }
    #pet[data-state="red"] .alert { display: block; }
    #pet[data-state="red"] .alert circle { animation: pulse 0.9s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { r: 5; opacity: 1; }
      50%      { r: 6; opacity: 0.75; }
    }

    /* red = something is stuck: the crab is jittery */
    #pet[data-state="red"] #crab { animation: bob 3.2s ease-in-out infinite, shake 0.35s linear infinite; }
    @keyframes shake {
      0%, 100% { translate: 0 0; }
      25%      { translate: -1.2px 0.6px; }
      75%      { translate: 1.2px -0.6px; }
    }

    /* WSL unreachable: crab goes gray and dozes off */
    #pet[data-state="off"] #crab { filter: grayscale(1); opacity: 0.8; }

    #badge {
      position: absolute;
      top: 4px;
      right: 4px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      background: #ef4444;
      color: #fff;
      font: bold 12px/20px system-ui, sans-serif;
      text-align: center;
      border: 2px solid #fff;
    }
    #badge.yellow { background: #eab308; color: #78350f; }
    #badge.hidden { display: none; }
  </style>
</head>
<body>
  <div id="pet" data-state="green">
    <!-- Clawd-style crab: coral body, big waving pincers, face on the shell -->
    <svg id="crab" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8825c"/>
          <stop offset="1" stop-color="#d97757"/>
        </linearGradient>
      </defs>

      <!-- legs -->
      <path d="M33 79 q-8 4 -13 3 M38 83 q-6 7 -12 8 M45 85 q-3 8 -8 10
               M67 79 q8 4 13 3 M62 83 q6 7 12 8 M55 85 q3 8 8 10"
            stroke="#b85c3f" stroke-width="2.4" fill="none" stroke-linecap="round"/>

      <!-- body -->
      <ellipse cx="50" cy="64" rx="27" ry="20" fill="url(#shell)" stroke="#b85c3f" stroke-width="1.5"/>
      <ellipse cx="50" cy="70" rx="14" ry="10" fill="#f4c6a8"/>

      <!-- claws: pincer + arm, pivoting at the wrist -->
      <g class="claw claw-l">
        <path d="M27 54 C31 59 34 62 37 65" stroke="#d97757" stroke-width="6.5"
              fill="none" stroke-linecap="round"/>
        <path d="M25 53 C29 49 29 43 26 38 L19 43 L11 37 C4.5 34.5 2.5 42 6 48 C9.5 54.5 19 56.5 25 53 Z"
              fill="url(#shell)" stroke="#b85c3f" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
      <g class="claw claw-r">
        <path d="M73 54 C69 59 66 62 63 65" stroke="#d97757" stroke-width="6.5"
              fill="none" stroke-linecap="round"/>
        <path d="M75 53 C71 49 71 43 74 38 L81 43 L89 37 C95.5 34.5 97.5 42 94 48 C90.5 54.5 81 56.5 75 53 Z"
              fill="url(#shell)" stroke="#b85c3f" stroke-width="1.5" stroke-linejoin="round"/>
      </g>

      <!-- eyes -->
      <g class="eyes happy">
        <g class="eye">
          <ellipse cx="41" cy="60" rx="3" ry="4" fill="#451a03"/>
          <circle cx="42" cy="58.5" r="1" fill="#fff"/>
        </g>
        <g class="eye">
          <ellipse cx="59" cy="60" rx="3" ry="4" fill="#451a03"/>
          <circle cx="60" cy="58.5" r="1" fill="#fff"/>
        </g>
      </g>
      <g class="eyes alarmed">
        <ellipse cx="41" cy="60" rx="4.5" ry="5" fill="#fff" stroke="#451a03" stroke-width="1.2"/>
        <circle cx="41.5" cy="60.5" r="2" fill="#451a03"/>
        <ellipse cx="59" cy="60" rx="4.5" ry="5" fill="#fff" stroke="#451a03" stroke-width="1.2"/>
        <circle cx="59.5" cy="60.5" r="2" fill="#451a03"/>
      </g>
      <g class="eyes asleep">
        <path d="M37 60 q4 3 8 0" fill="none" stroke="#451a03" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M55 60 q4 3 8 0" fill="none" stroke="#451a03" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- mouth + blush -->
      <path class="mouth smile" d="M45.5 68 q2.2 2.8 4.5 0 q2.3 2.8 4.5 0"
            fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse class="mouth gasp" cx="50" cy="70" rx="2.6" ry="3.2" fill="#9f1239"/>
      <ellipse cx="32" cy="67" rx="3.5" ry="2" fill="#fad2be" opacity="0.8"/>
      <ellipse cx="68" cy="67" rx="3.5" ry="2" fill="#fad2be" opacity="0.8"/>

      <!-- extras -->
      <path class="sweat" d="M81 16 q3.5 5 0 7 q-3.5 -2 0 -7 Z" fill="#7dd3fc"/>
      <g class="alert">
        <circle cx="50" cy="26" r="5" fill="#ef4444"/>
        <text x="50" y="29.3" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#fff">!</text>
      </g>
    </svg>
    <div id="badge" class="hidden"></div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
