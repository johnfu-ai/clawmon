<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude WSL 监控</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">◆</span>
      <span data-i18n="app.title">Claude WSL 监控</span>
      <span id="summary" class="summary"></span>
    </div>
  </header>

  <!-- The unified main nav. Rendered by app.js from one NAV array — no page
       may add, remove or restyle items; only the active highlight moves.
       This is the production half of the constraint the prototypes enforced
       with _shared/layout.js. -->
  <nav id="nav" aria-label="主导航"></nav>

  <div id="banner" class="banner hidden"></div>

  <main id="page-sessions" class="page">
    <div id="list">
      <!-- session rows rendered by app.js -->
    </div>
    <div id="empty" class="empty hidden">
      <div class="empty-icon">⌘</div>
      <p data-i18n="empty.title">未发现运行中的 Claude Code 会话</p>
      <p class="hint" data-i18n="empty.hint">在 WSL 终端里启动 claude 即可自动识别</p>
    </div>
  </main>

  <main id="page-tasks" class="page hidden">
    <div class="page-head">
      <h2 data-i18n="tasks.title">任务清单</h2>
      <span id="task-count" class="sub"></span>
      <button id="btn-new-task" class="primary sm" data-i18n="tasks.act.new">+ 新建</button>
    </div>
    <div id="task-list"></div>
    <div id="task-empty" class="empty hidden">
      <div class="empty-icon">▶</div>
      <p data-i18n="tasks.empty.title">任务清单为空</p>
      <p class="hint" data-i18n="tasks.empty.hint">把常用的 claude 任务存成一键启动</p>
    </div>

    <div id="task-modal" class="modal-backdrop hidden">
      <div class="modal">
        <h3><span id="task-modal-title" data-i18n="tasks.new">新建任务</span><span id="task-modal-close" class="close">×</span></h3>
        <form id="task-form">
          <label><span data-i18n="tasks.form.title">标题</span>
            <input type="text" name="title" maxlength="64" required /></label>
          <label><span data-i18n="tasks.form.cwd">目录（WSL 绝对路径）</span>
            <input type="text" name="cwd" placeholder="~/work/webapp" required /></label>
          <label><span data-i18n="tasks.form.command">命令</span>
            <textarea name="command" rows="2" placeholder='claude "修复登录bug"' required></textarea>
            <span class="hint" data-i18n="tasks.form.hint">例：claude "…" · make test · 多命令直接换行</span></label>
          <div class="form-actions">
            <button type="button" id="task-cancel" data-i18n="act.cancel">取消</button>
            <button type="submit" class="primary" data-i18n="tasks.form.save">保存任务</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <main id="page-usage" class="page hidden">
    <div class="page-head">
      <h2 data-i18n="usage.title">套餐额度</h2>
      <span id="usage-level" class="sub"></span>
    </div>
    <div id="usage-quotas" class="quota-card"></div>
    <div class="page-head">
      <h2 data-i18n="usage.sessions">会话 token 用量</h2>
      <span class="sub" data-i18n="usage.sessions.hint">本转录累计</span>
    </div>
    <div id="usage-rows" class="usage-rows"></div>
  </main>

  <section id="page-settings" class="page hidden">
    <form id="settings-form">
      <label><span data-i18n="set.language">语言 / Language</span>
        <select name="language">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <!-- number inputs are `required` so the browser blocks empty/invalid
           submission; min/max mirror Settings::sanitize, which owns the
           bounds (e.g. the wait may run to 7 days for a weekly quota) -->
      <label><span data-i18n="set.poll">轮询间隔（秒）</span>
        <input type="number" name="pollIntervalSecs" min="2" max="3600" required />
      </label>
      <label><span data-i18n="set.idle">活跃判定（秒）——多长时间无输出算“空闲”</span>
        <input type="number" name="idleGreenSecs" min="5" max="86400" required />
      </label>
      <label><span data-i18n="set.blocked">超时判定（秒）——等待响应超过该时长视为 API 超时</span>
        <input type="number" name="blockedAfterSecs" min="10" max="86400" required />
      </label>
      <label class="check-row"><input type="checkbox" name="autoContinue" />
        <span data-i18n="set.auto">自动继续</span></label>
      <label class="check-row"><input type="checkbox" name="closeToTray" />
        <span data-i18n="set.tray">关闭窗口时最小化到托盘（后台继续监控）</span></label>
      <label class="check-row"><input type="checkbox" name="showGlmUsage" />
        <span data-i18n="set.usage">显示 GLM 套餐用量（底部状态栏）</span></label>
      <label><span data-i18n="set.wait">等待时长（小时）——红灯后多久自动继续</span>
        <input type="number" name="waitHours" min="0" max="168" step="0.5" required />
      </label>
      <label><span data-i18n="set.keys">继续按键（tmux 键名，空格分隔）</span>
        <input type="text" name="resumeKeys" placeholder="Enter" />
      </label>
      <label><span data-i18n="set.max">最大自动尝试次数</span>
        <input type="number" name="maxSends" min="1" max="100" required />
      </label>
      <label><span data-i18n="set.retry">重试间隔（分钟）</span>
        <input type="number" name="retryIntervalMin" min="1" max="1440" required />
      </label>
      <label><span data-i18n="set.distro">WSL 发行版（留空 = 默认）</span>
        <input type="text" name="wslDistro" placeholder="Ubuntu" />
      </label>

      <h3 data-i18n="set.notify">桌面通知</h3>
      <label class="check-row"><input type="checkbox" name="notifyRed" />
        <span data-i18n="set.notify.red">会话变红时</span></label>
      <label class="check-row"><input type="checkbox" name="notifyContinue" />
        <span data-i18n="set.notify.continue">自动继续已发送时</span></label>
      <label class="check-row"><input type="checkbox" name="notifyRecovered" />
        <span data-i18n="set.notify.recovered">红灯解除时</span></label>
      <label class="check-row"><input type="checkbox" name="notifyTurnEnd" />
        <span data-i18n="set.notify.turn">回合结束等待输入时</span></label>
      <label class="check-row"><input type="checkbox" name="notifyExit" />
        <span data-i18n="set.notify.exit">会话进程退出时</span></label>
      <label class="check-row"><input type="checkbox" name="soundAlerts" />
        <span data-i18n="set.sound">提示音（伴随通知）</span></label>

      <div class="settings-actions">
        <button type="submit" class="primary" data-i18n="act.save">保存</button>
      </div>
    </form>
    <p class="hint"><span data-i18n="hint.tmux1">提示：只有运行在 tmux 里的 Claude Code 才能被自动控制，建议用 </span><code>tmux new -s work</code><span data-i18n="hint.tmux2">后在里面启动 claude。</span></p>
  </section>

  <footer>
    <span id="foot-status">连接 WSL…</span>
    <span id="usage-chip" class="usage-chip hidden"></span>
    <span id="foot-clock"></span>
  </footer>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
