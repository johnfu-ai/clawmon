[package]
name = "cc-monitor"
version.workspace = true
edition.workspace = true
description = "Claude Code WSL session monitor"

[lib]
name = "cc_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cc-monitor-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# SW_SHOWNOACTIVATE (pet without stealing focus), MessageBeep (alerts),
# GetCursorPos/GetAsyncKeyState (pet click-through hotspot),
# CreateMutexW (single-instance guard; its signature mentions
# SECURITY_ATTRIBUTES, hence Win32_Security)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }
